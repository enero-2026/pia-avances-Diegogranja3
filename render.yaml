services:
  - type: web
    name: pia-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /data/db.sqlite
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1